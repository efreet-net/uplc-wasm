name: Reference fidelity
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'nightly-2026-09-04'
      - run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo +1.96.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            .cache/upstreams
            tools/oracle-aiken/target
            tools/oracle-amaru/target
          key: references-${{ runner.os }}-${{ hashFiles('upstreams.lock.json', '**/Cargo.lock') }}
      - run: make reference-check builtin-all-check generated-flat-check
      - run: make generated
      - name: Generated cases against both references
        run: >-
          python3 tools/conformance.py --corpus .cache/generated.jsonl
          --engine aiken=tools/oracle-aiken/target/debug/oracle-aiken
          --engine amaru=tools/oracle-amaru/target/debug/oracle-amaru
          --artifacts artifacts/generated
      - name: Candidate coverage against both references
        run: >-
          python3 tools/conformance.py --engine native=target/debug/uplc-native
          --engine aiken=tools/oracle-aiken/target/debug/oracle-aiken
          --engine amaru=tools/oracle-amaru/target/debug/oracle-amaru
          --allow-unsupported --artifacts artifacts/candidate
      - name: Retained builtin reference disagreements (expected to fail)
        id: builtin_audit
        continue-on-error: true
        run: make builtin-reference-audit
      - name: Require the exact retained audit failures
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.builtin_audit.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          assert os.environ['AUDIT_OUTCOME'] == 'failure', 'the audit must remain visibly failing'
          report = json.loads(Path('artifacts/builtins/reference-audit/report.json').read_text())
          cases = [json.loads(line) for line in Path('fixtures/builtins-reference-audit.jsonl').read_text().splitlines()]
          expected = {case['id']: ('error' if case['id'] == 'builtins/probe/builtin-charge-overflow' else 'mismatch') for case in cases}
          actual = {case['id']: case['category'] for case in report['cases']}
          assert actual == expected and len(report['cases']) == len(expected), report['summary']
          assert report['summary'] == {'pass': 0, 'mismatch': 23, 'error': 1, 'unsupported': 0, 'total': 24, 'complete': False}
          print('Retained audit is incomplete: exactly 23 mismatches and 1 reference infrastructure error; zero conformance passes.')
          PY
      - name: Import full pinned corpus
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tools/import_plutus.py --output artifacts/plutus.jsonl
      - name: Full corpus audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: >-
          python3 tools/conformance.py --corpus artifacts/plutus.jsonl
          --engine aiken=tools/oracle-aiken/target/debug/oracle-aiken
          --engine amaru=tools/oracle-amaru/target/debug/oracle-amaru
          --allow-unsupported --artifacts artifacts/full-corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-results
          path: artifacts/
