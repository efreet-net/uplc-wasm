[workspace]
resolver = "2"
members = ["crates/uplc-core", "crates/uplc-wasm", "crates/conformance"]
exclude = ["tools/oracle-aiken", "tools/oracle-amaru", "fuzz", ".cache"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
hex = "0.4.3"
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
